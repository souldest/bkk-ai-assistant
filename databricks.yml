bundle:
  name: bkk-ai-assistant

resources:
  apps:
    app:
      name: "bkk-ai-assistant"
      description: "A Databricks App powered by AppKit"
      source_code_path: ./

      lifecycle:
        started: true

      resources:
        - name: "vector-search-index"
          uc_securable:
            securable_type: "TABLE"
            securable_full_name: "workspace.healthcare_ai.document_chunks_index"
            permission: "SELECT"
        - name: "minilm-embedding"
          serving_endpoint:
            name: "minilm-embedding"
            permission: "CAN_QUERY"
        - name: "llm"
          serving_endpoint:
            name: "databricks-gpt-oss-120b"
            permission: "CAN_QUERY"

targets:
  default:
    default: true
    workspace:
      host: https://dbc-095b518c-0a9b.cloud.databricks.com
